[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-harness"
version = "0.4.0"
license = {file = "LICENSE"}
description = "Local, model-independent long-form narrative state and acceptance workflow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harness = "narrative_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narrative_harness = ["schemas/*.json"]
